<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Addresses — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .addr-container { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    .addr-card {
      background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .addr-label {
      display: inline-block; background: var(--green100); color: var(--green700);
      font-size: 10px; font-weight: 700; padding: 2px 10px; border-radius: 20px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .addr-text { font-size: 13px; color: var(--text); line-height: 1.5; }
    .addr-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .addr-actions button {
      background: #FEE2E2; color: #DC2626; border: none; border-radius: 8px;
      padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center;
    }
    .addr-form-toggle {
      width: 100%; padding: 13px; border-radius: 12px; border: 1.5px dashed var(--green500);
      background: var(--green50); color: var(--green700); font-weight: 700; font-size: 14px;
      cursor: pointer; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
  </style>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="addr-container">
    <div class="page-header" style="padding:16px 0">
      <div class="page-title" id="page-title-el"></div>
    </div>

    <button class="addr-form-toggle" id="toggle-form-btn" onclick="toggleForm()"></button>

    <div class="form-container" id="addr-form" style="display:none; margin: 0 0 20px;">
      <div class="form-error" id="error-msg"></div>
      <div class="form-group">
        <label>Label</label>
        <input type="text" id="label" placeholder="Home / Farm / Warehouse" />
      </div>
      <div class="form-group">
        <label>Full Address</label>
        <input type="text" id="line1" placeholder="House no, street, village" />
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="city" placeholder="Ludhiana" />
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" id="state" placeholder="Punjab" />
      </div>
      <div class="form-group">
        <label>Pincode</label>
        <input type="text" id="pincode" placeholder="141001" />
      </div>
      <button class="btn btn-primary" onclick="handleSaveAddress()" id="save-addr-btn"></button>
    </div>

    <div id="addresses-list">
      <div class="loading">Loading addresses...</div>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>

    window.onload = async () => {
      if (!isLoggedIn()) { window.location.href = "login.html"; return; }
      renderHeader("../");
      renderDrawer("../");

      document.getElementById("page-title-el").innerHTML  = `${icon("map-pin", 22)} My Addresses`;
      document.getElementById("toggle-form-btn").innerHTML = `${icon("plus", 16)} Add New Address`;
      document.getElementById("save-addr-btn").innerHTML   = `${icon("save", 16)} Save Address`;
      refreshIcons();

      await loadAddresses();
    };

    const toggleForm = () => {
      const form = document.getElementById("addr-form");
      form.style.display = form.style.display === "none" ? "block" : "none";
    };

    const loadAddresses = async () => {
      const data = await apiCall("/auth/profile");
      const list = document.getElementById("addresses-list");

      if (!data.success || !data.user.addresses || data.user.addresses.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <p>No saved addresses yet!</p>
          </div>`;
        return;
      }

      list.innerHTML = data.user.addresses.map(a => `
        <div class="addr-card">
          <div>
            <span class="addr-label">${a.label}</span>
            <div class="addr-text">${a.line1}, ${a.city}, ${a.state} - ${a.pincode}</div>
          </div>
          <div class="addr-actions">
            <button onclick="deleteAddress('${a.id}')">${icon("trash-2", 14)}</button>
          </div>
        </div>
      `).join("");
      refreshIcons();
    };

    const handleSaveAddress = async () => {
      const label   = document.getElementById("label").value.trim();
      const line1   = document.getElementById("line1").value.trim();
      const city    = document.getElementById("city").value.trim();
      const state   = document.getElementById("state").value.trim();
      const pincode = document.getElementById("pincode").value.trim();
      const errorMsg = document.getElementById("error-msg");
      errorMsg.style.display = "none";

      if (!label || !line1 || !city || !state || !pincode) {
        errorMsg.textContent   = "Please fill all fields!";
        errorMsg.style.display = "block";
        return;
      }

      const btn = document.getElementById("save-addr-btn");
      btn.textContent = "Saving...";
      btn.disabled    = true;

      const data = await apiCall("/addresses", "POST", { label, line1, city, state, pincode });

      if (data.success) {
        document.getElementById("addr-form").style.display = "none";
        ["label","line1","city","state","pincode"].forEach(id => document.getElementById(id).value = "");
        await loadAddresses();
        showNotification("Address saved!", "success", "check-circle");
      } else {
        errorMsg.textContent   = data.message || "Could not save address";
        errorMsg.style.display = "block";
      }

      btn.innerHTML = `${icon("save", 16)} Save Address`;
      btn.disabled  = false;
      refreshIcons();
    };

    const deleteAddress = async (id) => {
      if (!confirm("Delete this address?")) return;
      await apiCall(`/addresses/${id}`, "DELETE");
      await loadAddresses();
      showNotification("Address deleted!", "success", "trash-2");
    };

  </script>
</body>
</html>
