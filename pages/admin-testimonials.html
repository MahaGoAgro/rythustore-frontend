<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials — RythuStore Admin</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .admin-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    .admin-form { background:white;border-radius:16px;padding:20px;box-shadow:var(--shadow-md);border:1px solid var(--border);position:sticky;top:80px; }
    .admin-form .form-group { margin-bottom:12px; }
    .admin-form .form-group label { font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;display:block; }
    .admin-form .form-group input,
    .admin-form .form-group textarea,
    .admin-form .form-group select { width:100%;padding:10px 14px;border-radius:9px;border:1px solid var(--border);font-size:13px;color:var(--text);background:var(--page);outline:none;font-family:inherit; }
    .admin-form .form-group textarea { min-height:80px;resize:vertical; }
    .admin-form .form-group input:focus,
    .admin-form .form-group textarea:focus { border-color:var(--green500);background:white; }
    .form-title { font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:6px; }
    .testimonial-list { background:white;border-radius:16px;padding:20px;box-shadow:var(--shadow-md);border:1px solid var(--border); }
    .testimonial-card { border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px; }
    .testimonial-card-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px; }
    .testimonial-name { font-weight:700;font-size:14px;color:var(--text); }
    .testimonial-location { font-size:11px;color:var(--muted);margin-top:2px; }
    .testimonial-stars { color:#F59E0B;font-size:13px;margin-bottom:5px; }
    .testimonial-text { font-size:13px;color:var(--text-secondary);line-height:1.5; }
    .testimonial-crop { display:inline-block;background:var(--green100);color:var(--green700);font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:6px; }
    .testimonial-actions { display:flex;gap:6px;margin-top:10px; }
    .btn-edit { background:var(--green100);color:var(--green700);border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer; }
    .btn-delete { background:#FEE2E2;color:#DC2626;border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer; }
    .verified-badge { background:#ECFDF5;color:#065F46;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px; }
    .nav-links { display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap; }
    .nav-link { font-size:13px;font-weight:600;color:var(--text-secondary);text-decoration:none;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:white;display:flex;align-items:center;gap:5px; }
    .nav-link.active { background:var(--green700);color:white;border-color:var(--green700); }
    @media (max-width:768px) { .admin-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="admin-container">
    <div style="padding:20px 0 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:20px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px" id="page-title"></div>
        <div style="color:var(--muted);font-size:13px;margin-top:4px">Manage farmer success stories shown on home page</div>
      </div>
      <a href="../index.html" class="btn btn-outline" style="text-decoration:none;display:flex;align-items:center;gap:6px" id="view-store-btn"></a>
    </div>

    <div class="nav-links">
      <a href="admin.html"              class="nav-link" id="products-link"></a>
      <a href="admin-orders.html"       class="nav-link" id="orders-link"></a>
      <a href="admin-crop-prices.html"  class="nav-link" id="crops-link"></a>
      <a href="admin-testimonials.html" class="nav-link active" id="testimonials-link"></a>
    </div>

    <div class="admin-grid">
      <!-- Form -->
      <div class="admin-form">
        <div class="form-title" id="form-title"></div>
        <div class="form-error" id="error-msg"></div>
        <input type="hidden" id="testimonial-id" />

        <div class="form-group">
          <label>Farmer Name</label>
          <input type="text" id="t-name" placeholder="Ramesh Kumar" />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="t-location" placeholder="Guntur, Andhra Pradesh" />
        </div>
        <div class="form-group">
          <label>Crop / Product Used</label>
          <input type="text" id="t-crop" placeholder="Cotton, Chilli Seeds..." />
        </div>
        <div class="form-group">
          <label>Rating</label>
          <select id="t-rating">
            <option value="5">⭐⭐⭐⭐⭐ 5 stars</option>
            <option value="4">⭐⭐⭐⭐ 4 stars</option>
            <option value="3">⭐⭐⭐ 3 stars</option>
          </select>
        </div>
        <div class="form-group">
          <label>Success Story</label>
          <textarea id="t-message" placeholder="Share the farmer's experience and results..."></textarea>
        </div>
        <div class="form-group">
          <label>Photo URL (optional)</label>
          <input type="url" id="t-image" placeholder="https://..." />
        </div>

        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-primary" onclick="handleSubmit()" id="submit-btn" style="display:flex;align-items:center;justify-content:center;gap:6px"></button>
          <button class="btn btn-outline" onclick="resetForm()" id="cancel-btn" style="display:none">Cancel</button>
        </div>
      </div>

      <!-- List -->
      <div class="testimonial-list">
        <div class="form-title" id="list-title"></div>
        <div style="font-size:12px;color:var(--muted);margin-top:-12px;margin-bottom:14px">
          ✅ Verified reviews from customers are automatically included
        </div>
        <div id="testimonials-list"><div class="loading">Loading...</div></div>
      </div>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    let allTestimonials = [];
    let editingId = null;

    window.onload = async () => {
      if (!isLoggedIn()) { window.location.href = "login.html"; return; }
      const user = getUser();
      if (user.role !== "ADMIN") { alert("Access denied!"); window.location.href = "../index.html"; return; }

      renderHeader("../");
      renderDrawer("../");

      document.getElementById("page-title").innerHTML        = `${icon("message-circle", 20)} Farmer Stories`;
      document.getElementById("view-store-btn").innerHTML    = `${icon("globe", 14)} View Store`;
      document.getElementById("products-link").innerHTML     = `${icon("box", 14)} Products`;
      document.getElementById("orders-link").innerHTML       = `${icon("package", 14)} Orders`;
      document.getElementById("crops-link").innerHTML        = `${icon("trending-up", 14)} Crop Prices`;
      document.getElementById("testimonials-link").innerHTML = `${icon("message-circle", 14)} Stories`;
      document.getElementById("form-title").innerHTML        = `${icon("plus", 16)} Add Story`;
      document.getElementById("submit-btn").innerHTML        = `${icon("plus", 14)} Add Story`;
      document.getElementById("list-title").innerHTML        = `${icon("list", 16)} All Stories`;
      refreshIcons();

      await loadTestimonials();
    };

    const loadTestimonials = async () => {
      const data = await apiCall("/testimonials");
      if (!data.success) {
        document.getElementById("testimonials-list").innerHTML = `<div class="empty-state"><p>Could not load stories!</p></div>`;
        return;
      }
      allTestimonials = data.testimonials.filter(t => !t.isReview); // only admin-added
      renderTestimonials(data.testimonials);
    };

    const renderTestimonials = (testimonials) => {
      const list = document.getElementById("testimonials-list");
      if (testimonials.length === 0) {
        list.innerHTML = `<div class="empty-state"><p>No stories yet! Add the first farmer success story.</p></div>`;
        return;
      }

      list.innerHTML = testimonials.map(t => `
        <div class="testimonial-card">
          <div class="testimonial-card-header">
            <div>
              <div class="testimonial-name">${t.name}</div>
              <div class="testimonial-location">${t.location || ""}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              ${t.isReview ? `<span class="verified-badge">✓ Verified Review</span>` : ""}
            </div>
          </div>
          <div class="testimonial-stars">${"★".repeat(t.rating)}${"☆".repeat(5 - t.rating)}</div>
          <div class="testimonial-text">${t.message}</div>
          ${t.crop ? `<span class="testimonial-crop">${icon("sprout", 10)} ${t.crop}</span>` : ""}
          ${!t.isReview ? `
            <div class="testimonial-actions">
              <button class="btn-edit"   onclick="editTestimonial('${t.id}')">${icon("pencil", 11)} Edit</button>
              <button class="btn-delete" onclick="deleteTestimonial('${t.id}')">${icon("trash-2", 11)} Delete</button>
            </div>
          ` : ""}
        </div>
      `).join("");
      refreshIcons();
    };

    const handleSubmit = async () => {
      const name     = document.getElementById("t-name").value.trim();
      const location = document.getElementById("t-location").value.trim();
      const crop     = document.getElementById("t-crop").value.trim();
      const rating   = document.getElementById("t-rating").value;
      const message  = document.getElementById("t-message").value.trim();
      const imageUrl = document.getElementById("t-image").value.trim();
      const errorMsg = document.getElementById("error-msg");

      errorMsg.style.display = "none";
      if (!name || !message) { errorMsg.textContent = "Name and story are required!"; errorMsg.style.display = "block"; return; }

      const btn = document.getElementById("submit-btn");
      btn.innerHTML = "Saving...";
      btn.disabled  = true;

      const endpoint = editingId ? `/testimonials/${editingId}` : "/testimonials";
      const method   = editingId ? "PUT" : "POST";
      const data     = await apiCall(endpoint, method, { name, location, crop, rating, message, imageUrl: imageUrl || null });

      if (data.success) {
        showNotification(editingId ? "Story updated!" : "Story added!", "success", "check-circle");
        resetForm();
        await loadTestimonials();
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
      }

      btn.innerHTML = editingId ? `${icon("save", 14)} Update` : `${icon("plus", 14)} Add Story`;
      btn.disabled  = false;
      refreshIcons();
    };

    const editTestimonial = (id) => {
      const t = allTestimonials.find(t => t.id === id);
      if (!t) return;
      editingId = id;
      document.getElementById("t-name").value     = t.name;
      document.getElementById("t-location").value = t.location || "";
      document.getElementById("t-crop").value     = t.crop || "";
      document.getElementById("t-rating").value   = t.rating;
      document.getElementById("t-message").value  = t.message;
      document.getElementById("t-image").value    = t.imageUrl || "";
      document.getElementById("form-title").innerHTML   = `${icon("pencil", 16)} Edit Story`;
      document.getElementById("submit-btn").innerHTML   = `${icon("save", 14)} Update`;
      document.getElementById("cancel-btn").style.display = "block";
      refreshIcons();
      document.querySelector(".admin-form").scrollIntoView({ behavior: "smooth" });
    };

    const deleteTestimonial = async (id) => {
      if (!confirm("Delete this story?")) return;
      const data = await apiCall(`/testimonials/${id}`, "DELETE");
      if (data.success) { showNotification("Story deleted!", "success", "trash-2"); await loadTestimonials(); }
    };

    const resetForm = () => {
      editingId = null;
      ["testimonial-id","t-name","t-location","t-crop","t-message","t-image"].forEach(id => { document.getElementById(id).value = ""; });
      document.getElementById("t-rating").value          = "5";
      document.getElementById("error-msg").style.display = "none";
      document.getElementById("form-title").innerHTML    = `${icon("plus", 16)} Add Story`;
      document.getElementById("submit-btn").innerHTML    = `${icon("plus", 14)} Add Story`;
      document.getElementById("cancel-btn").style.display = "none";
      refreshIcons();
    };
  </script>
</body>
</html>
