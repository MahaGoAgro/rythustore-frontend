<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="form-container">
    <div class="form-title">Forgot Password?</div>
    <div class="form-subtitle">Enter your email and we'll send you a reset link</div>

    <div class="form-error"   id="error-msg"></div>
    <div id="success-msg" style="display:none;background:#ECFDF5;color:#065F46;padding:12px;border-radius:8px;font-size:13px;margin-bottom:13px;line-height:1.5;"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="ramesh@gmail.com" />
    </div>

    <button class="btn btn-primary" onclick="handleForgot()" id="forgot-btn">
      Send Reset Link
    </button>
    <div class="form-link">
      Remember your password? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    window.onload = () => {
      renderHeader("../");
      renderDrawer("../");
    };

    const handleForgot = async () => {
      const email    = document.getElementById("email").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      const btn      = document.getElementById("forgot-btn");

      errorMsg.style.display  = "none";
      successMsg.style.display = "none";

      if (!email) {
        errorMsg.textContent   = "Please enter your email address!";
        errorMsg.style.display = "block";
        return;
      }

      btn.textContent = "Sending...";
      btn.disabled    = true;

      const data = await apiCall("/auth/forgot-password", "POST", { email });

      // Always show the same success message whether email exists or not
      // This prevents attackers from guessing which emails are registered
      successMsg.innerHTML = `
        <strong>Check your inbox!</strong><br>
        If an account exists for <strong>${email}</strong>, a password reset
        link has been sent. It expires in 1 hour.<br><br>
        Don't see it? Check your spam folder.
      `;
      successMsg.style.display = "block";
      btn.textContent = "Send Reset Link";
      btn.disabled    = false;
    };

    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleForgot();
    });
  </script>
</body>
</html>
