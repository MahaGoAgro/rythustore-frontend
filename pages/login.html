<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .google-btn {
      width: 100%;
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 4px;
    }
    .google-btn:hover {
      border-color: #4285F4;
      box-shadow: 0 1px 6px rgba(66,133,244,0.15);
    }
    .google-logo {
      width: 18px;
      height: 18px;
    }
    .forgot-link {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 10px;
    }
    .forgot-link a { font-size: 12px; color: var(--green700); font-weight: 600; }
  </style>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <!-- Hidden Google One Tap div -->
  <div id="g_id_onload"
    data-client_id="71107159619-b2jqrd0dhq088of63nppkpihm15ce61h.apps.googleusercontent.com"
    data-callback="handleGoogleResponse"
    data-auto_prompt="false">
  </div>

  <div class="form-container">
    <div class="form-title">Welcome Back!</div>
    <div class="form-subtitle">Login to your RythuStore account</div>
    <div class="form-error" id="error-msg"></div>

    <!-- Google Sign-In Button -->
    <button class="google-btn" onclick="triggerGoogleSignIn()">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or continue with email</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="ramesh@gmail.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <div class="forgot-link">
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <button class="btn btn-primary" onclick="handleLogin()" id="login-btn">
      Login to RythuStore
    </button>

    <div class="form-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    window.onload = () => {
      renderHeader("../");
      renderDrawer("../");
    };

    if (isLoggedIn()) window.location.href = "../index.html";

    // ── Google Sign-In ─────────────────────────
    const triggerGoogleSignIn = () => {
      google.accounts.id.initialize({
        client_id: "71107159619-b2jqrd0dhq088of63nppkpihm15ce61h.apps.googleusercontent.com",
        callback:  handleGoogleResponse,
      });
      google.accounts.id.prompt();
    };

    const handleGoogleResponse = async (response) => {
      const errorMsg = document.getElementById("error-msg");
      errorMsg.style.display = "none";

      const data = await apiCall("/auth/google", "POST", {
        credential: response.credential
      });

      if (data.success) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("user",  JSON.stringify(data.user));
        const redirectTo = sessionStorage.getItem("redirectAfterLogin");
        if (redirectTo) {
          sessionStorage.removeItem("redirectAfterLogin");
          window.location.href = redirectTo;
        } else {
          window.location.href = "../index.html";
        }
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
      }
    };

    // ── Email/Password Login ───────────────────
    const handleLogin = async () => {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      const btn      = document.getElementById("login-btn");

      errorMsg.style.display = "none";

      if (!email || !password) {
        errorMsg.textContent   = "Please fill all fields!";
        errorMsg.style.display = "block";
        return;
      }

      btn.textContent = "Logging in...";
      btn.disabled    = true;

      const data = await login(email, password);

      if (data.success) {
        const redirectTo = sessionStorage.getItem("redirectAfterLogin");
        if (redirectTo) {
          sessionStorage.removeItem("redirectAfterLogin");
          window.location.href = redirectTo;
        } else {
          window.location.href = "../index.html";
        }
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
        btn.textContent        = "Login to RythuStore";
        btn.disabled           = false;
      }
    };

    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
