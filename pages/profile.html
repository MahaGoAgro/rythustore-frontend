<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .profile-container {
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--green100);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green700);
      margin: 0 auto 16px;
    }
    .profile-role {
      display: inline-block;
      background: var(--green100);
      color: var(--green700);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .profile-form {
      text-align: left;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar"></div>
      <div id="profile-name" style="font-size:20px;font-weight:800;color:var(--green900)"></div>
      <div id="profile-email" style="color:var(--muted);font-size:14px;margin-top:2px"></div>
      <div class="profile-role" id="profile-role"></div>

      <div class="profile-form">
        <div class="form-error" id="error-msg"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" />
        </div>
        <button class="btn btn-primary" onclick="handleSave()" id="save-btn"></button>
      </div>
    </div>
  </div>
  
  <script src="../js/i18n.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>

    window.onload = async () => {
      if (!isLoggedIn()) { window.location.href = "login.html"; return; }
      renderHeader("../");
      renderDrawer("../");
      if (typeof applyLanguage === "function") applyLanguage();
      document.getElementById("profile-avatar").innerHTML = icon("user", 36);
      document.getElementById("save-btn").innerHTML = `${icon("save", 16)} Save Changes`;
      refreshIcons();
      await loadProfile();
    };

    const loadProfile = async () => {
      const data = await apiCall("/auth/profile");
      if (!data.success) return;

      const u = data.user;
      document.getElementById("profile-name").textContent  = u.name;
      document.getElementById("profile-email").textContent = u.email;
      document.getElementById("profile-role").textContent  = u.role;
      document.getElementById("name").value  = u.name;
      document.getElementById("phone").value = u.phone || "";
    };

    const handleSave = async () => {
      const name  = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const errorMsg = document.getElementById("error-msg");
      errorMsg.style.display = "none";

      if (!name) {
        errorMsg.textContent   = "Name is required!";
        errorMsg.style.display = "block";
        return;
      }

      const btn = document.getElementById("save-btn");
      btn.textContent = "Saving...";
      btn.disabled    = true;

      const data = await apiCall("/auth/profile", "PUT", { name, phone });

      if (data.success) {
        const user = getUser();
        user.name = data.user.name;
        localStorage.setItem("user", JSON.stringify(user));
        document.getElementById("profile-name").textContent = data.user.name;
        showNotification("Profile updated!", "success", "check-circle");
      } else {
        errorMsg.textContent   = data.message || "Could not save changes";
        errorMsg.style.display = "block";
      }

      btn.innerHTML   = `${icon("save", 16)} Save Changes`;
      btn.disabled    = false;
      refreshIcons();
    };

  </script>
</body>
</html>
