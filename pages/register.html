<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="form-container">
    <div class="form-title">Create Account</div>
    <div class="form-subtitle">Join millions of farmers on RythuStore</div>
    <div class="form-error" id="error-msg"></div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Ramesh Kumar" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="ramesh@gmail.com" />
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="9999999999" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Repeat your password" />
    </div>
    <button class="btn btn-primary" onclick="handleRegister()">Create My Account</button>
    <div class="form-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    window.onload = () => {
      renderHeader("../");
      renderDrawer("../");
    };

    if (isLoggedIn()) window.location.href = "../index.html";

    const handleRegister = async () => {
      const name            = document.getElementById("name").value.trim();
      const email           = document.getElementById("email").value.trim();
      const phone           = document.getElementById("phone").value.trim();
      const password        = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirm-password").value.trim();
      const errorMsg        = document.getElementById("error-msg");

      errorMsg.style.display = "none";

      if (!name || !email || !password) {
        errorMsg.textContent   = "Please fill all required fields!";
        errorMsg.style.display = "block";
        return;
      }
      if (password.length < 6) {
        errorMsg.textContent   = "Password must be at least 6 characters!";
        errorMsg.style.display = "block";
        return;
      }
      if (password !== confirmPassword) {
        errorMsg.textContent   = "Passwords do not match!";
        errorMsg.style.display = "block";
        return;
      }

      const btn       = document.querySelector(".btn-primary");
      btn.textContent = "Creating account...";
      btn.disabled    = true;

      const data = await register(name, email, phone, password);

      if (data.success) {
        window.location.href = "../index.html";
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
        btn.textContent        = "Create My Account";
        btn.disabled           = false;
      }
    };

    document.addEventListener("keypress", (e) => { if (e.key === "Enter") handleRegister(); });
  </script>
</body>
</html>
