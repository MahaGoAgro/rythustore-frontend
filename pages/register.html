<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .google-btn {
      width: 100%;
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 4px;
    }
    .google-btn:hover {
      border-color: #4285F4;
      box-shadow: 0 1px 6px rgba(66,133,244,0.15);
    }
    .google-logo { width: 18px; height: 18px; }
    .strength-bar-wrap { height: 4px; background: var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 11px; margin-top: 5px; font-weight: 600; }
    .requirement { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 4px; transition: color 0.2s; }
    .requirement.met { color: #2D7A3A; }
    .password-wrap { position: relative; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; }
  </style>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="form-container">
    <div class="form-title">Create Account</div>
    <div class="form-subtitle">Join RythuStore — Your Farm. Our Mission.</div>
    <div class="form-error" id="error-msg"></div>

    <!-- Google Sign-In -->
    <button class="google-btn" onclick="triggerGoogleSignIn()">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or register with email</div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Ramesh Kumar" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="ramesh@gmail.com" />
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="9999999999" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="Min 8 chars, A-Z, 0-9, !@#$" oninput="checkStrength(this.value)" />
        <button type="button" class="toggle-password" onclick="togglePassword('password','eye-1')">
          <i data-lucide="eye" id="eye-1" style="width:16px;height:16px"></i>
        </button>
      </div>
      <div class="strength-bar-wrap"><div class="strength-bar" id="strength-bar"></div></div>
      <div class="strength-label" id="strength-label"></div>
      <div class="requirement" id="req-length"><span id="icon-length">○</span> At least 8 characters</div>
      <div class="requirement" id="req-upper"><span id="icon-upper">○</span> One uppercase letter (A-Z)</div>
      <div class="requirement" id="req-number"><span id="icon-number">○</span> One number (0-9)</div>
      <div class="requirement" id="req-special"><span id="icon-special">○</span> One special character (!@#$%)</div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirm-password" placeholder="Repeat your password" />
        <button type="button" class="toggle-password" onclick="togglePassword('confirm-password','eye-2')">
          <i data-lucide="eye" id="eye-2" style="width:16px;height:16px"></i>
        </button>
      </div>
    </div>

    <button class="btn btn-primary" onclick="handleRegister()" id="register-btn">
      Create My Account
    </button>
    <div class="form-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    window.onload = () => {
      renderHeader("../");
      renderDrawer("../");
      refreshIcons();
    };

    if (isLoggedIn()) window.location.href = "../index.html";

    // ── Google Sign-In ─────────────────────────
    const triggerGoogleSignIn = () => {
      google.accounts.id.initialize({
        client_id: "71107159619-b2jqrd0dhq088of63nppkpihm15ce61h.apps.googleusercontent.com",
        callback:  handleGoogleResponse,
      });
      google.accounts.id.prompt();
    };

    const handleGoogleResponse = async (response) => {
      const errorMsg = document.getElementById("error-msg");
      errorMsg.style.display = "none";

      const data = await apiCall("/auth/google", "POST", {
        credential: response.credential
      });

      if (data.success) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("user",  JSON.stringify(data.user));
        window.location.href = "../index.html";
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
      }
    };

    // ── Password show/hide ─────────────────────
    const togglePassword = (inputId, iconId) => {
      const input = document.getElementById(inputId);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      document.getElementById(iconId).setAttribute("data-lucide", isHidden ? "eye-off" : "eye");
      refreshIcons();
    };

    // ── Password strength ──────────────────────
    const checkStrength = (val) => {
      const rules = {
        length:  val.length >= 8,
        upper:   /[A-Z]/.test(val),
        number:  /[0-9]/.test(val),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val),
      };
      Object.entries(rules).forEach(([key, met]) => {
        document.getElementById(`req-${key}`).classList.toggle("met", met);
        document.getElementById(`icon-${key}`).textContent = met ? "✓" : "○";
      });
      const score = Object.values(rules).filter(Boolean).length;
      const levels = [
        { pct:"0%",   color:"",        text:"",         textColor:"" },
        { pct:"25%",  color:"#E24B4A", text:"Weak",     textColor:"#A32D2D" },
        { pct:"50%",  color:"#F59E0B", text:"Fair",     textColor:"#854F0B" },
        { pct:"75%",  color:"#3B82F6", text:"Good",     textColor:"#1D4ED8" },
        { pct:"100%", color:"#2D7A3A", text:"Strong ✓", textColor:"#2D7A3A" },
      ];
      document.getElementById("strength-bar").style.width      = levels[score].pct;
      document.getElementById("strength-bar").style.background = levels[score].color;
      document.getElementById("strength-label").textContent    = levels[score].text;
      document.getElementById("strength-label").style.color    = levels[score].textColor;
    };

    // ── Email/Password Register ────────────────
    const handleRegister = async () => {
      const name            = document.getElementById("name").value.trim();
      const email           = document.getElementById("email").value.trim();
      const phone           = document.getElementById("phone").value.trim();
      const password        = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const errorMsg        = document.getElementById("error-msg");

      errorMsg.style.display = "none";

      if (!name || !email || !password) {
        errorMsg.textContent   = "Please fill all required fields!";
        errorMsg.style.display = "block";
        return;
      }

      const checks = [
        password.length >= 8,
        /[A-Z]/.test(password),
        /[0-9]/.test(password),
        /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password),
      ];

      if (!checks.every(Boolean)) {
        errorMsg.textContent   = "Password does not meet all requirements!";
        errorMsg.style.display = "block";
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent   = "Passwords do not match!";
        errorMsg.style.display = "block";
        return;
      }

      const btn = document.getElementById("register-btn");
      btn.textContent = "Creating account...";
      btn.disabled    = true;

      const data = await register(name, email, phone, password);

      if (data.success) {
        window.location.href = "../index.html";
      } else {
        errorMsg.textContent   = data.message;
        errorMsg.style.display = "block";
        btn.textContent        = "Create My Account";
        btn.disabled           = false;
      }
    };

    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleRegister();
    });
  </script>
</body>
</html>
