<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RythuStore</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .strength-bar-wrap { height: 4px; background: var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 11px; margin-top: 5px; font-weight: 600; }
    .requirement { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 4px; transition: color 0.2s; }
    .requirement.met { color: #2D7A3A; }
    .password-wrap { position: relative; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; }
  </style>
</head>
<body>

  <div id="header-root"></div>
  <div id="drawer-root"></div>

  <div class="form-container">
    <div class="form-title">Set New Password</div>
    <div class="form-subtitle">Choose a strong password for your account</div>

    <div class="form-error" id="error-msg"></div>

    <!-- Token expired state -->
    <div id="expired-msg" style="display:none;text-align:center;padding:20px 0">
      <div style="font-size:32px;margin-bottom:8px">⏱️</div>
      <div style="font-weight:700;color:var(--text)">Link Expired</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">This reset link has expired or already been used.</div>
      <a href="forgot-password.html" class="btn btn-primary" style="display:block;margin-top:16px;text-decoration:none;text-align:center">
        Request New Link
      </a>
    </div>

    <!-- Reset form -->
    <div id="reset-form">
      <div class="form-group">
        <label>New Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Min 8 chars, A-Z, 0-9, !@#$" oninput="checkStrength(this.value)" />
          <button type="button" class="toggle-password" onclick="togglePassword('password', 'eye-1')">
            <i data-lucide="eye" id="eye-1" style="width:16px;height:16px"></i>
          </button>
        </div>
        <div class="strength-bar-wrap"><div class="strength-bar" id="strength-bar"></div></div>
        <div class="strength-label" id="strength-label"></div>
        <div class="requirement" id="req-length"><span id="icon-length">○</span> At least 8 characters</div>
        <div class="requirement" id="req-upper"><span id="icon-upper">○</span> At least one uppercase letter</div>
        <div class="requirement" id="req-number"><span id="icon-number">○</span> At least one number</div>
        <div class="requirement" id="req-special"><span id="icon-special">○</span> At least one special character</div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="password-wrap">
          <input type="password" id="confirm-password" placeholder="Repeat your password" />
          <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', 'eye-2')">
            <i data-lucide="eye" id="eye-2" style="width:16px;height:16px"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary" onclick="handleReset()" id="reset-btn">
        Update Password
      </button>
    </div>
  </div>
  
  <script src="../js/i18n.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-drawer.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    window.onload = () => {
      renderHeader("../");
      renderDrawer("../");
      if (typeof applyLanguage === "function") applyLanguage();
      refreshIcons();

      if (!token) {
        document.getElementById("reset-form").style.display   = "none";
        document.getElementById("expired-msg").style.display  = "block";
      }
    };

    const togglePassword = (inputId, iconId) => {
      const input = document.getElementById(inputId);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      document.getElementById(iconId).setAttribute("data-lucide", isHidden ? "eye-off" : "eye");
      refreshIcons();
    };

    const checkStrength = (val) => {
      const rules = {
        length:  val.length >= 8,
        upper:   /[A-Z]/.test(val),
        number:  /[0-9]/.test(val),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val),
      };
      Object.entries(rules).forEach(([key, met]) => {
        document.getElementById(`req-${key}`).classList.toggle("met", met);
        document.getElementById(`icon-${key}`).textContent = met ? "✓" : "○";
      });
      const score = Object.values(rules).filter(Boolean).length;
      const levels = [
        { pct:"0%",   color:"",        text:"",         textColor:"" },
        { pct:"25%",  color:"#E24B4A", text:"Weak",     textColor:"#A32D2D" },
        { pct:"50%",  color:"#F59E0B", text:"Fair",     textColor:"#854F0B" },
        { pct:"75%",  color:"#3B82F6", text:"Good",     textColor:"#1D4ED8" },
        { pct:"100%", color:"#2D7A3A", text:"Strong ✓", textColor:"#2D7A3A" },
      ];
      document.getElementById("strength-bar").style.width      = levels[score].pct;
      document.getElementById("strength-bar").style.background = levels[score].color;
      document.getElementById("strength-label").textContent    = levels[score].text;
      document.getElementById("strength-label").style.color    = levels[score].textColor;
    };

    const handleReset = async () => {
      const password        = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const errorMsg        = document.getElementById("error-msg");
      const btn             = document.getElementById("reset-btn");

      errorMsg.style.display = "none";

      if (!password) {
        errorMsg.textContent   = "Please enter a new password!";
        errorMsg.style.display = "block";
        return;
      }

      const checks = [
        password.length >= 8,
        /[A-Z]/.test(password),
        /[0-9]/.test(password),
        /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password),
      ];

      if (!checks.every(Boolean)) {
        errorMsg.textContent   = "Password does not meet all requirements!";
        errorMsg.style.display = "block";
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent   = "Passwords do not match!";
        errorMsg.style.display = "block";
        return;
      }

      btn.textContent = "Updating...";
      btn.disabled    = true;

      const data = await apiCall("/auth/reset-password", "POST", { token, password });

      if (data.success) {
        window.location.href = "login.html?reset=success";
      } else {
        if (data.message?.includes("expired") || data.message?.includes("invalid")) {
          document.getElementById("reset-form").style.display  = "none";
          document.getElementById("expired-msg").style.display = "block";
        } else {
          errorMsg.textContent   = data.message;
          errorMsg.style.display = "block";
          btn.textContent        = "Update Password";
          btn.disabled           = false;
        }
      }
    };
  </script>
</body>
</html>
